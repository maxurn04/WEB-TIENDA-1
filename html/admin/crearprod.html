<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../../css/estilo.css"> 
</head>
<body class="admin-cuerpo">

    <div class="container-fluid p-0">
        <div class="row g-0">

            <aside class="col-12 col-md-3 col-xl-2 p-3 admin-lateral">
                
                <h4 class="admin-contenedor-logo text-center">
                    <img src="../../img/logoRV-NF.png" alt="" class="img-fluid img-center admin-img-logo">
                </h4>

                <ul class="nav flex-row flex-md-column admin-lista-nav">
                    <li class="nav-item">
                        <a href="../../html/admin/inicioadmin.html" class="nav-link fw-bold admin-enlace-nav">Resumen</a>
                    </li>
                    <li class="nav-item">
                        <a href="../../html/admin/mostrarproductos.html" class="nav-link admin-enlace-nav">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link admin-enlace-nav">Nuevo usuario</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link admin-enlace-nav">Editar usuario</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link admin-enlace-nav">Mostrar usuarios</a>
                    </li>
                </ul>

            </aside>
        
            <main class="col-12 col-md-9 col-xl-10 p-4 p-md-5 admin-fondo-crear">

                <div class="p-4 p-md-5 mx-auto admin-caja-formulario">
                    
                    <div class="mb-4 p-2 text-center text-uppercase caja-gris fuente-palabras admin-titulo-formulario">
                        Crear nuevo producto
                    </div>

                    <form id="form-producto">
                        
                        <div class="mb-3">
                            <label class="form-label text-uppercase admin-etiqueta-form">Nombre del producto</label>
                            <input type="text" id="admin-nombre" class="form-control rounded-0 border-dark" maxlength="100" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-uppercase admin-etiqueta-form">Código</label>
                            <input type="text" id="admin-codigo" class="form-control rounded-0 border-dark" minlength="3" required placeholder="BARXXXXXX">
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-uppercase admin-etiqueta-form">Precio</label>
                            <input type="number" id="admin-precio" class="form-control rounded-0 border-dark" min="0" step="any" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-uppercase admin-etiqueta-form">Stock</label>
                            <input type="number" id="admin-stock" class="form-control rounded-0 border-dark" min="0" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-uppercase admin-etiqueta-form">Stock Crítico (Bajo nivel seguro)</label>
                            <input type="number" id="admin-stock-critico" class="form-control rounded-0 border-dark" min="0">
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-uppercase admin-etiqueta-form">Descripción (Opcional)</label>
                            <textarea id="admin-desc" class="form-control rounded-0 border-dark" rows="2" maxlength="500"></textarea>
                        </div>

                        <div class="row mt-5">
                            <div class="col-12 col-md-6 mb-3 mb-md-0">
                                <label class="form-label text-uppercase admin-etiqueta-form">- Seleccione la categoría -</label>
                                <select id="admin-categoria" class="form-select rounded-0 border-dark" required>
                                    <option value="">Seleccione una categoría...</option>
                                    <option value="Consolas">Consolas</option>
                                    <option value="Juegos">Juegos</option>
                                    <option value="Accesorios">Accesorios</option>
                                </select>
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label text-uppercase admin-etiqueta-form">Ruta de la imagen</label>
                                <input type="text" id="admin-img" class="form-control rounded-0 border-dark" placeholder="../img/ejemplo.jpg">
                            </div>
                        </div>

                        <div class="text-center mt-5 pt-3">
                            <button type="submit" class="btn text-uppercase px-5 py-2 admin-btn-registrar">
                                Registrar
                            </button>
                        </div>

                    </form>
                </div>
            </main>
        </div>
    </div>

    <script src="../../js/crearProdAdm.js"></script>
</body>
</html>
