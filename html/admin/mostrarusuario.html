<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mostrar Usuario - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../../css/estilo.css">
</head>
<body>
   <div class="container-fluid p-0">
        <div class="row g-0">

            <aside class="col-12 col-md-3 col-xl-2 p-3 admin-lateral">
                
                <h4 class="admin-contenedor-logo text-center">
                    <img src="../../img/logoRV-NF.png" alt="Logo RV" class="img-fluid admin-img-logo">
                </h4>

                <ul class="nav flex-row flex-md-column admin-lista-nav">
                    <li class="nav-item">
                        <a href="../../html/admin/inicioadmin.html" class="nav-link admin-enlace-nav">Resumen</a>
                    </li>
                    <li class="nav-item">
                        <a href="../../html/admin/mostrarproductos.html" class="nav-link admin-enlace-nav ">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a href="../../html/admin/crearusuario.html" class="nav-link admin-enlace-nav">Nuevo usuario</a>
                    </li>
                    <li class="nav-item">
                        <a href="../../html/admin/mostrarusuario.html" class="nav-link admin-enlace-nav fw-bold">Mostrar usuarios</a>
                    </li>
                    <li class="nav-item">
                        <a id = "btn-cerrar-sesion-adm" href="../index.html" class="nav-link admin-enlace-nav">Volver a la tienda</a>
                    </li>
                </ul>

            </aside>
            

            <main class="col-12 col-md-9 col-xl-10 p-4 admin-contenido-principal">
                
                <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                    <h2 class="fuente-palabras mb-3 mb-md-0 admin-titulo-pagina">Mostrar Usuarios</h2>
                </div>

                <div class="p-4 admin-caja-tabla">
                    <div class="admin-ancho-tabla">
                            <div class="p-4">
                    <form id="f-registro" class="container p-4" style="background-color: #ffffff; border: 1px solid #cccccc; border-radius: 8px; max-width: 700px;">
                    <div class="row">
                        <div class="col-3">
                            <label for="r-run" class="form-label">RUN</label>
                            <input type="text" class="form-control" id="r-run" required>
                        </div>

                        <div class="col">
                            <label for="r-nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="r-nombre" maxlength="50" required>
                        </div>

                        <div class="col">
                            <label for="r-apellidos" class="form-label">Apellidos</label>
                            <input type="text" class="form-control" id="r-apellidos" maxlength="100" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col">
                            <label for="r-correo" class="form-label">Correo</label>
                            <input type="email" class="form-control" id="r-correo" required>
                        </div>

                        <div class="col">
                            <label for="r-passw" class="form-label">Contraseña</label>
                            <input type="text" class="form-control" id="r-passw" minlength="4" maxlength="10" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col">
                            <label for="r-telf" class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" id="r-telf" required>
                        </div>

                        <div class="col">
                            <label for="r-fecha" class="form-label">Fecha de Nacimiento</label>
                            <input type="date" class="form-control" id="r-fecha" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col">
                            <label for="r-reg" class="form-label">Región</label>
                            <input class="form-control" id="r-reg" required>    
                        </input>
                        </div>

                        <div class="col">
                            <label for="r-comu" class="form-label">Comuna</label>
                            <input class="form-control" id="r-comu" required>
                        </input>
                        </div>  
                    </div>

                    <div class="row">
                        <div class="mb-3">
                            <label for="r-direccion" class="form-label">Dirección</label>
                            <input type="text" class="form-control" id="r-direccion" maxlength="300" required>
                        </div>

                    </div>


                    <div class="row">
                        <div class="col-2">
                            <label for="r-direccion" class="form-label">ID</label>
                            <input type="text" class="form-control" id="r-id" readonly>
                        </div>

                    </div>
                        <br>
                        <div class="row" justify-content-center align-items-center gx-4 >
                            <div class="col text-center">
                            <button id="adminboton1" class="btn btn-dark col-6">Guardar Cambios</button>
                            </div>
                            <div class="col text-center">
                            <button id="adminboton2" class="btn btn-dark col-6 ">Borrar Usuario</button>
                            </div>

                        </div>


                
                    </form>
                </div>
                <br>

                        <div class="row mb-3 pb-2 fuente-palabras admin-encabezado-tabla">
                            <div class="col-2">Run</div>
                            <div class="col-3">Nombre</div>
                            <div class="col-2">Correo</div>
                            <div class="col-3">Telefono</div>
                            <div class="col-2">direccion</div>
                        </div>

                        <div id="tabla-productos-admin"></div>
                        
                    </div>
                </div>

            </main>
        </div>
    </div> 
    <script src="../../js/mostrarusuarios.js"></script>
</body>
</html>
