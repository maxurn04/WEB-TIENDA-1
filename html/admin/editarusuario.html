<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar usuario - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../../css/estilo.css">
</head>
<body style="background-color: #ffffff; margin: 0; padding: 0;">

    <div class="container-fluid p-0">
        <div class="row g-0">

            <aside class="col-12 col-md-3 col-xl-2 p-3" style="background-color: #e0e0e0; border-right: 1px solid #cccccc; border-bottom: 1px solid #cccccc;">

                <h4 style="color: #333333; border-bottom: 2px solid #cccccc; padding-bottom: 10px; margin-bottom: 15px;">
                    <img src="../../img/logoRV-NF.png" alt="logo" height="60PX">
                </h4>

                <ul class="nav flex-row flex-md-column" style="overflow-x: auto; flex-wrap: nowrap;">
                    <li class="nav-item">
                        <a href="../../html/admin/inicioadmin.html" class="nav-link fw-bold" style="color: #333333; white-space: nowrap; padding-left: 0;">Resumen</a>
                    </li>
                    <li class="nav-item">
                        <a href="../../html/admin/mostrarproductos.html" class="nav-link" style="color: #333333; white-space: nowrap; padding-left: 0;">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a href="../../html/admin/crearusuario.html" class="nav-link fw-bold" style="color: #333333; white-space: nowrap; padding-left: 0;">Nuevo usuario</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" style="color: #333333; white-space: nowrap; padding-left: 0;">Mostrar usuarios</a>
                    </li>
                </ul>

            </aside>
            <main class="col-12 col-md-9 col-xl-10 p-0" style="background-color: #f2f2f2; min-height: 100vh;">
                <div class="p-4 d-flex justify-content-between align-items-center" style="background-color: #e0e0e0; border-bottom: 1px solid #cccccc;">
                    <h1 class="fw-semibold m-0 fs-2" style="color: #333333;">Editar Usuario</h1>
                </div>

                <div class="p-4">
                    <form id="f-registro" class="p-4" style="background-color: #ffffff; border: 1px solid #cccccc; border-radius: 8px; max-width: 700px;">
                        <div class="mb-3">
                            <label for="r-run" class="form-label">RUN</label>
                            <input type="text" class="form-control" id="r-run" required>
                        </div>

                        <div class="mb-3">
                            <label for="r-nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="r-nombre" maxlength="50" required>
                        </div>

                        <div class="mb-3">
                            <label for="r-apellidos" class="form-label">Apellidos</label>
                            <input type="text" class="form-control" id="r-apellidos" maxlength="100" required>
                        </div>

                        <div class="mb-3">
                            <label for="r-correo" class="form-label">Correo</label>
                            <input type="email" class="form-control" id="r-correo" required>
                        </div>

                        <div class="mb-3">
                            <label for="r-passw" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="r-passw" minlength="4" maxlength="10" required>
                        </div>

                        <div class="mb-3">
                            <label for="r-telf" class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" id="r-telf" required>
                        </div>

                        <div class="mb-3">
                            <label for="r-fecha" class="form-label">Fecha de Nacimiento</label>
                            <input type="date" class="form-control" id="r-fecha" required>
                        </div>

                        <div class="mb-3">
                            <label for="r-direccion" class="form-label">Dirección</label>
                            <input type="text" class="form-control" id="r-direccion" maxlength="300" required>
                        </div>

                        <div class="mb-3">
                            <label for="r-reg" class="form-label">Región</label>
                            <select class="form-select" id="r-reg" required>
                                <option value="">Seleccione la región</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="r-comu" class="form-label">Comuna</label>
                            <select class="form-select" id="r-comu" required>
                                <option value="">Seleccione la comuna</option>
                            </select>
                        </div>

                        <button type="submit" class="btn boton-colores-inicio">Guardar Cambios</button>
                        
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script src="../../js/registroadmin.js"></script>
</body>
</html>
