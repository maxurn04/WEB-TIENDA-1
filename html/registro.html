    <div class="container mt-5 mb-5 pt-5">
        <div class="row">
        <div class="col-12 col-md-8 mx-auto p-4 caja-registro" style = "background-image: url(../img/bf-degr-reves2.png);">
            <div>
            <div class="caja-reg-inicio-peq">
                <h5 class="mb-0">Registro de usuario</h5>
            </div>
            <form id = "f-registro">
                <div class="mb-3">
                    <label class="form-label mb-1">NOMBRE COMPLETO</label>
                    <input type="text" id="r-nombre" class="form-control border-dark" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label mb-1">CORREO</label>
                    <input type="email" id="r-correo" class="form-control border-dark" required>
                </div>
                

                <div class="mb-3">
                    <label class="form-label  mb-1">CONFIRMAR CORREO</label>
                    <input type="email" id="r-correo-conf" class="form-control border-dark" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label  mb-1">CONTRASEÑA</label>
                    <input type="password" id="r-passw" class="form-control border-dark" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label  mb-1">CONFIRMAR CONTRASEÑA</label>
                    <input type="password" id="r-passw-conf" class="form-control border-dark" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label  mb-1">TELEFONO (opcional)</label>
                    <input type="tel" id="r-telf" class="form-control border-dark">
                </div>
                
                <div class="row mt-4">
                    <div class="col-12 col-md-6 mb-3" style="padding-bottom: 150px; padding-top: 20px;">
                        <select id="r-reg" class="form-select border-dark border-2" >
                            <option selected>- Seleccione la región -</option>
                            <option value="1">Región Metropolitana de Santiago</option>
                            <option value="2">Región de Valparaiso</option>
                            <option value="3">Región de O'Higgins</option>
                            <option value="4">Región del Maule</option>

                        </select>
                    </div>
                    <div class="col-12 col-md-6 mb-3" style="padding-bottom: 150px; padding-top: 20px;">
                        <select id="r-comu" class="form-select border-dark border-2">
                            <option selected>- Seleccione la comuna -</option>
                            <option value="1">Santiago (Centro)</option>
                            <option value="2">Providencia</option>
                            <option value="3">Ñuñoa</option>
                            <option value="4">La Florida</option>
                            <option value="5">San Joaquin</option>
                            <option value="6">Macul</option>

                        </select>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <button type="submit" class="btn boton-reini">REGISTRAR</button>
                </div>
            </form>

        </div>
    </div>
</div>

<script src="../js/registro.js"></script>
