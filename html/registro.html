    <div class="container mt-5 mb-5 pt-5">
        <div class="row">
        <div class="col-12 col-md-8 mx-auto p-4 caja-gris">
            <div>
            <div class="caja-reg-inicio-peq">
                <h5 class="mb-0 fuente-palabras">Registro de usuario</h5>
            </div>
            
            <form id="f-registro">
                
                <div class="mb-3">
                    <label class="form-label mb-1 fuente-palabras-slim">RUN (Sin puntos ni guión)*</label>
                    <input type="text" id="r-run" class="form-control border-dark" minlength="7" maxlength="9" placeholder="Ej: 19011022K" required>
                </div>

                <div class="row">
                    <div class="col-12 col-md-6 mb-3">
                        <label class="form-label mb-1 fuente-palabras-slim">NOMBRE*</label>
                        <input type="text" id="r-nombre" class="form-control border-dark" maxlength="50" required>
                    </div>
                    <div class="col-12 col-md-6 mb-3">
                        <label class="form-label mb-1 fuente-palabras-slim">APELLIDOS*</label>
                        <input type="text" id="r-apellidos" class="form-control border-dark" maxlength="100" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12 col-md-6 mb-3">
                        <label class="form-label mb-1 fuente-palabras-slim">CORREO*</label>
                        <input type="email" id="r-correo" class="form-control border-dark" maxlength="100" required>
                    </div>
                    <div class="col-12 col-md-6 mb-3">
                        <label class="form-label mb-1 fuente-palabras-slim">CONFIRMAR CORREO*</label>
                        <input type="email" id="r-correo-conf" class="form-control border-dark" maxlength="100" required>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-12 col-md-6 mb-3">
                        <label class="form-label mb-1 fuente-palabras-slim">CONTRASEÑA*</label>
                        <input type="password" id="r-passw" class="form-control border-dark" minlength="4" maxlength="10" required>
                    </div>
                    <div class="col-12 col-md-6 mb-3">
                        <label class="form-label mb-1 fuente-palabras-slim">CONFIRMAR CONTRASEÑA*</label>
                        <input type="password" id="r-passw-conf" class="form-control border-dark" minlength="4" maxlength="10" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12 col-md-6 mb-3">
                        <label class="form-label mb-1 fuente-palabras-slim">TELÉFONO (Opcional)</label>
                        <input type="tel" id="r-telf" class="form-control border-dark">
                    </div>
                    <div class="col-12 col-md-6 mb-3">
                        <label class="form-label mb-1 fuente-palabras-slim">FECHA DE NACIMIENTO (Opcional)</label>
                        <input type="date" id="r-fecha" class="form-control border-dark">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label mb-1 fuente-palabras-slim">DIRECCIÓN DE ENTREGA*</label>
                    <input type="text" id="r-direccion" class="form-control border-dark" maxlength="300" required>
                </div>
                
                <div class="row mt-4 mb-4">
                    <div class="col-12 col-md-6 mb-3">
                        <select id="r-reg" class="form-select border-dark border-2" required>
                            <option value="">Seleccione la región</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-6 mb-3">
                        <select id="r-comu" class="form-select border-dark border-2" required>
                            <option value="">Seleccione la comuna</option>
                        </select>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <button type="submit" class="btn boton-reini px-5 py-2">REGISTRAR</button>
                </div>
            </form>

        </div>
    </div>
    </div>

<script src="../js/registro.js"></script>
</body>
